name: hoja_health_suite
description: تطبيق هوجاء الطبي - Hoja Health Suite (Flutter Edition)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.0
  crypto: ^3.0.3
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  intl: ^0.19.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hoja_logo.jpg
